# Osaka test relay only. Install after obtaining the named certificate.
# Includes must live inside nginx's http context. Existing Xray owns 443.
limit_req_zone $binary_remote_addr zone=ss_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ss_clients:1m;
limit_conn_zone $server_name zone=ss_total:1m;
server {
    listen 8443 ssl;
    server_name relay.privyluxe.com;
    ssl_certificate /etc/letsencrypt/live/relay.privyluxe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.privyluxe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn ss_clients 12;
    limit_conn ss_total 128;
    # Exclude query strings and authorization from access logs.
    access_log off;
    location = /media {
        limit_req zone=ss_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location ~ ^/(health|v1/(self-register|activate|join|status|invite|approve|decline|revoke|heartbeat|push/token|push/clear|push/wake|signal/send|signal/poll))$ {
        limit_req zone=ss_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location / { return 404; }
}
