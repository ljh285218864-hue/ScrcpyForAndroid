<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Android 双机远程控制台</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{background:#090e19;color:#f5f7fc;margin:0}
header{max-width:1240px;margin:auto;padding:22px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
h1{font-size:21px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.subtitle{color:#a6b2c8;font-size:12px;margin:0}
.state{display:flex;align-items:center;gap:7px;color:#c2d3f6;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;background:#46cc95;border-radius:50%}
nav{display:flex;gap:8px;padding:0 18px;max-width:1240px;margin:auto auto 20px}
button{background:#1b263a;color:#d5e1fa;border:1px solid #384860;padding:11px 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
button.active{background:#4f86ff;border-color:#4f86ff;color:white}
main{max-width:1240px;margin:auto;padding:0 18px 36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.phone-card{background:#141d2c;border:1px solid #2b3c58;border-radius:18px;overflow:hidden;min-width:0}
.phone-heading{padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.phone-heading b{font-size:15px}
.phone-heading span{font-size:12px;color:#96accd}
.phone-heading a{color:#a7c8ff;text-decoration:none;font-size:12px;border:1px solid #42536c;padding:8px 10px;border-radius:9px;white-space:nowrap}
.frame-wrap{background:#080a0f;position:relative;aspect-ratio:1 / 1;overflow:hidden}
iframe{border:0;width:100%;height:100%;background:#080a0f}
.hint{padding:11px 14px 14px;color:#9aacc7;font-size:12px;line-height:1.55}
main.single{grid-template-columns:1fr;max-width:770px}
main.single .phone-card:not(.selected){display:none}
main.single .frame-wrap{aspect-ratio:1 / 1}
footer{color:#8c9bb6;max-width:1240px;margin:0 auto;padding:0 18px 25px;font-size:12px;line-height:1.7}
@media(max-width:700px){header{padding-top:calc(16px + env(safe-area-inset-top))}main{grid-template-columns:1fr;gap:12px}.frame-wrap{aspect-ratio:1 / 1}nav button{flex:1}h1{font-size:19px}}
</style>
</head>
<body>
<header><div><h1>Android 双机远程控制台</h1><p class="subtitle">Android 15 · 实时画面 · 只读观看</p></div><div class="state"><i class="dot"></i><span>私有控制台</span></div></header>
<nav aria-label="选择手机"><button type="button" class="active" data-mode="both">双机</button><button type="button" data-mode="a">只看 A</button><button type="button" data-mode="b">只看 B</button></nav>
<main id="views">
<section class="phone-card selected" id="card-a" aria-label="安卓手机 A">
<div class="phone-heading"><div><b>A 虚拟手机</b><div><span>被观看端</span></div></div><a href="/a/vnc.html?autoconnect=true&amp;resize=scale&amp;path=a%2Fwebsockify" target="_blank" rel="noopener noreferrer">单独全屏</a></div>
<div class="frame-wrap"><iframe title="Android A 远程桌面" loading="eager" allow="fullscreen" src="/a/vnc.html?autoconnect=true&amp;resize=scale&amp;path=a%2Fwebsockify"></iframe></div>
<div class="hint">仅显示虚拟手机 A 的画面，不支持远程触摸、滑动和输入。</div>
</section>
<section class="phone-card selected" id="card-b" aria-label="安卓手机 B">
<div class="phone-heading"><div><b>B 虚拟手机</b><div><span>操作与观看端</span></div></div><a href="/b/vnc.html?autoconnect=true&amp;resize=scale&amp;path=b%2Fwebsockify" target="_blank" rel="noopener noreferrer">单独全屏</a></div>
<div class="frame-wrap"><iframe title="Android B 远程桌面" loading="eager" allow="fullscreen" src="/b/vnc.html?autoconnect=true&amp;resize=scale&amp;path=b%2Fwebsockify"></iframe></div>
<div class="hint">B 是第二台安卓虚拟机。页面只读显示画面，不支持控制。</div>
</section>
</main>
<footer>此控制台需部署在支持 KVM 的云服务器上。请勿分享浏览密码。VNC 适合交互测试，但 YouTube 视频可能不流畅，且不传输安卓系统音频。</footer>
<script>
const buttons=[...document.querySelectorAll('button[data-mode]')];
const views=document.getElementById('views');
for(const btn of buttons){btn.addEventListener('click',()=>{
 for(const other of buttons)other.classList.toggle('active',other===btn);
 const mode=btn.dataset.mode;
 views.classList.toggle('single',mode!=='both');
 for(const id of ['a','b'])document.getElementById('card-'+id).classList.toggle('selected',mode==='both'||mode===id);
});}
</script>
</body>
</html>
