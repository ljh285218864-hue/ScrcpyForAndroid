name: ScreenSync viewing integration CI

on:
  push:
    branches:
      - feature/screensync-persistent-watch-consent-20261122
  pull_request:
    branches:
      - feature/screensync-accessibility-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleScrcpyDebug :app:testScrcpyDebugUnitTest --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screensync-viewing-debug-apk
          path: app/build/outputs/apk/scrcpy/debug/*.apk
          retention-days: 14
