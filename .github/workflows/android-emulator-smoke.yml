name: Android 15 Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install build SDK and native dependencies
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake patch bison flex

      - name: Build APK for x86_64 emulator
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleScrcpyDebug -PlibadbAbis=x86_64

      - name: Enable KVM
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "No /dev/kvm device on runner" >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-emulator-smoke-results
          path: emulator-test-results/
          if-no-files-found: warn
          retention-days: 14
