name: ScreenSync Accessibility-only APK (no ADB)

on:
  workflow_dispatch:
  push:
    branches: [feature/screensync-accessibility-only, feature/screensync-notifications-isolated]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - '.github/workflows/accessibility-only.yml'
      - 'remote/relay_v1/**'

permissions:
  contents: read

jobs:
  check-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify JPEG relay source and unit tests
        run: |
          bash -n remote/relay_v1/deploy/read-only-preflight.sh
          python3 -m venv "$RUNNER_TEMP/ss-relay"
          . "$RUNNER_TEMP/ss-relay/bin/activate"
          python3 -m pip install -r remote/relay_v1/requirements-media.txt
          python3 -m unittest discover -s remote/relay_v1 -p 'test_*.py' -v

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Guard pure accessibility screenshot product
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path('app/src/main/java/org/client/scrcpy')
          files = list(source.rglob('*.java'))
          forbidden = ('AdbHelper.java','LocalScrcpyStreamer.java',
                       'SystemAdbQrPairingSession.java','MainActivity.java',
                       'SendCommands.java','WakeLanService.java','Scrcpy.java',
                       'ScrcpyHost.java','UsbShellCompat.java')
          assert all(not (source / name).exists() for name in forbidden)
          assert not (source / 'usb').exists()
          assert not (source / 'utils').exists()
          assert not (source / 'decoder').exists()
          assert not (source / 'model').exists()
          assert 'include \u0027:server\u0027' not in Path('settings.gradle').read_text()
          gradle = Path('app/build.gradle').read_text()
          assert 'libadb' not in gradle.lower()
          assert 'copyServer' not in gradle
          manifest = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          services = [x.get(ns+'name','') for x in manifest.findall('.//service')]
          assert services == ['.AccessibilityShotService'], services
          assert (source / 'AccessibilityJpegStreamer.java').exists()
          assert 'AccessibilityShotService.capture(' in (source/'AccessibilityJpegStreamer.java').read_text()
          assert 'LocalScrcpyStreamer' not in (source/'RemoteSetupActivity.java').read_text()
          assert (Path('remote/relay_v1/media_relay.py')).exists()
          screenshot = (source / 'AccessibilityJpegStreamer.java').read_text()
          assert 'notification_permission_missing' not in screenshot
          assert 'showNoticeIfAllowed()' in screenshot
          assert 'stopIfNoVisibleStopControl()' in screenshot
          assert 'sourceUiVisible' not in screenshot
          assert 'showShareStopOverlay()' not in screenshot
          assert 'ensureVisibleStopControl()' in screenshot
          assert 'return noticePosted && ShareNotificationPreference.mayPost(app);' in screenshot
          assert 'if (!ShareNotificationPreference.mayPost(app)) return false;' in screenshot
          assert 'ShareNotificationPreference.mayPost(share.app)' in screenshot
          pref = (source/'ShareNotificationPreference.java').read_text()
          assert 'getBoolean(KEY_ENABLED, true)' in pref
          assert 'return isEnabled(ctx) && AccessibilityJpegStreamer.notificationAllowed(ctx)' in pref
          assert 'setEnabled(Context ctx, boolean enabled)' in pref
          ui = (source/'RemoteSetupActivity.java').read_text()
          assert 'ShareNotificationPreference.setEnabled(this, next)' in ui
          assert 'if (!next) AccessibilityJpegStreamer.stopIfNoVisibleStopControl()' in ui
          assert 'systemNotificationSettingsButton' not in ui
          assert 'openShareNotificationSettings()' not in ui
          assert 'ACTION_APP_NOTIFICATION_SETTINGS' not in ui
          assert '收到观看申请' in ui
          assert 'confirmPendingIncomingShare()' in ui
          assert 'declinePendingIncomingShare()' in ui
          assert 'new AlertDialog.Builder(RemoteSetupActivity.this)\n                                .setTitle("已配对设备请求观看")' not in ui
          assert 'requestPermissions(new String[]{\n                    Manifest.permission.POST_NOTIFICATIONS}' not in ui
          assert 'noticePosted = showNoticeIfAllowed()' in screenshot
          assert screenshot.index('noticePosted = showNoticeIfAllowed()') < screenshot.index('if (!ensureVisibleStopControl())')
          assert 'showStandbyWhenAllowed' not in screenshot
          assert 'notificationAllowed(appContext)' not in screenshot
          overlay = (source/'AccessibilityShotService.java').read_text()
          assert 'TYPE_ACCESSIBILITY_OVERLAY' not in overlay
          assert 'stopActiveFromOverlay()' not in screenshot
          assert 'shareWindowManager' not in overlay
          assert 'SYSTEM_ALERT_WINDOW' not in Path('app/src/main/AndroidManifest.xml').read_text()
          longterm = (source/'LongTermSharePolicy.java').read_text()
          assert 'enableByOwner' in longterm
          assert 'isLongTermReadyOverlayVisible()' not in longterm
          assert 'showLongTermReadyOverlay()' not in longterm
          assert 'LongTermSharePolicy.mayAutoApprove' in (source/'NoVpnMediaSocket.java').read_text()
          assert 'longTermReadyOverlay' not in (source/'AccessibilityShotService.java').read_text()
          assert 'incomingWatchOverlay' not in (source/'AccessibilityShotService.java').read_text()
          socket = (source/'NoVpnMediaSocket.java').read_text()
          assert 'LongTermSharePolicy.mayAutoApprove(context)' in socket
          assert 'persistentApprovedRequest = sid' in socket
          assert 'isLongTermReadyOverlayVisible()' not in socket
          assert 'AccessibilityJpegStreamer.hasVisibleStopControl()' in socket
          assert 'long_term_permission_revoked' in socket
          assert 'isPersistentSourceStartPending()' in (source/'RemoteSetupActivity.java').read_text()
          assert 'LongTermSharePolicy.showStandbyWhenAllowed(this)' not in (source/'AccessibilityShotService.java').read_text()
          assert 'ScreenSyncWatchNotice.show(context)' not in socket
          assert 'queued_for_in_app_confirmation' in socket
          incoming = (source/'ScreenSyncWatchNotice.java').read_text()
          assert 'manager.notify(' not in incoming
          assert 'public static void show(' not in incoming
          assert 'showIncomingWatchOverlay(' not in incoming
          assert '我同意长期共享' in (source/'RemoteSetupActivity.java').read_text()
          assert 'NoVpnPresenceLoop.start(context)' in (source/'NoVpnBackgroundSync.java').read_text()
          keeper = (source/'ScreenSyncMediaKeeper.java').read_text()
          assert 'restoreOptedInSignaling(Context context)' in keeper
          assert 'NoVpnBackgroundSync.isEnabled(context)' in keeper
          assert 'new NoVpnMediaSocket(context, null)' in keeper
          assert 'ScreenSyncMediaKeeper.restoreOptedInSignaling(context)' in (source/'NoVpnBackgroundSync.java').read_text()
          assert 'ScreenSyncMediaKeeper.restoreOptedInSignaling(application)' in (source/'NoVpnBackgroundSync.java').read_text()
          assert 'reconnectWhenNetworkAvailable()' in (source/'NoVpnMediaSocket.java').read_text()
          reconnect = (source/'NoVpnMediaSocket.java').read_text()
          assert 'SESSION_REJOIN' not in reconnect or 'REJOIN_WINDOW_MS = 60_000L' in reconnect
          assert 'session_resume' in reconnect and 'session_resumed' in reconnect
          assert 'AccessibilityJpegStreamer.resendCurrentSetup(this)' in reconnect
          assert 'isSourceTransportReady()' in (source/'AccessibilityJpegStreamer.java').read_text()
          assert 'AccessibilityJpegStreamer.hasVisibleStopControl()' in reconnect
          assert 'takeScreenshot(' not in reconnect
          assert 'SESSION_REJOIN_GRACE_SECONDS = 60' in (Path('remote/relay_v1/media_relay.py')).read_text()
          watch = (source / 'ScreenSyncWatchNotice.java').read_text()
          assert 'new Notification(' not in watch
          assert 'new NotificationChannel(' not in watch
          assert 'manager.notify(' not in watch
          java = list(source.rglob('*.java'))
          writers = [p.name for p in java if '.notify(' in p.read_text()]
          assert writers == ['AccessibilityJpegStreamer.java'], writers
          assert 'nm.notify(NOTICE_ID, notification.build())' in screenshot
          assert screenshot.count('nm.notify(NOTICE_ID, notification.build())') == 1
          acces = (source / 'AccessibilityShotService.java').read_text()
          assert 'TYPE_ACCESSIBILITY_OVERLAY' not in acces
          assert 'longTermReadyOverlay' not in acces
          assert 'incomingWatchOverlay' not in acces
          assert 'acceptRequest(' not in acces
          boot = (source/'NoVpnStandbyRestoreReceiver.java').read_text()
          for forbidden in ('takeScreenshot(', 'startService(', 'watch_accept',
                            'MediaProjection', 'startForeground('):
              assert forbidden not in boot
          import xml.etree.ElementTree as ET
          android = '{http://schemas.android.com/apk/res/android}'
          manifest = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          permissions = {p.attrib.get(android+'name') for p in manifest.findall('uses-permission')}
          assert 'android.permission.RECEIVE_BOOT_COMPLETED' in permissions
          print('PASS: accessibility/JPEG-only capture; legacy ADB deleted from application source')
          PY
      - name: Unit tests and assemble JPEG APK
        env:
          SCREENSYNC_NOVPN_URL: https://relay.privyluxe.com:8443
          SCREENSYNC_MEDIA_URL: wss://relay.privyluxe.com:8443/media
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testScrcpyDebugUnitTest :app:assembleScrcpyDebug --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/scrcpy/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -s "$apk"
          unzip -t "$apk" | tail -2
          python3 - "$apk" <<'PY'
          import sys,zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              assert not any('libadb.so' in n for n in names), 'old native ADB packed'
              assert not any('scrcpy-server.jar' in n for n in names), 'old scrcpy server packed'
              dex = b''.join(z.read(n) for n in names if n.startswith('classes') and n.endswith('.dex'))
              assert b'org/client/scrcpy/AccessibilityShotService' in dex
              assert b'org/client/scrcpy/AccessibilityJpegStreamer' in dex
              for forbidden in (b'org/client/scrcpy/AdbHelper',
                                b'org/client/scrcpy/LocalScrcpyStreamer',
                                b'org/client/scrcpy/MainActivity',
                                b'org/client/scrcpy/WakeLanService'):
                  assert forbidden not in dex, f'old component in DEX: {forbidden}'
              for endpoint in (b'https://relay.privyluxe.com:8443',
                               b'wss://relay.privyluxe.com:8443/media'):
                  assert endpoint in dex, f'missing relay endpoint {endpoint}'
          print('PASS: APK contains native Android screenshot source, no wireless ADB binary/classes')
          PY
          cp "$apk" ScreenSync-Accessibility-JPEG-NoADB-arm64.apk
          sha256sum ScreenSync-Accessibility-JPEG-NoADB-arm64.apk \
            > ScreenSync-Accessibility-JPEG-NoADB-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Accessibility-JPEG-NoADB
          path: |
            ScreenSync-Accessibility-JPEG-NoADB-arm64.apk
            ScreenSync-Accessibility-JPEG-NoADB-arm64.sha256
          retention-days: 14
          if-no-files-found: error
