name: Build guided QR Android APK (reuse verified native ADB)
# Final remote VPN beta after legacy-peer metadata synchronization fixes.
# Parent-friendly notification settings built using public Android APIs.
# Rebuild corrected DNS-SD unit tests and the embedded QR camera.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-guided-qr-fast.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out guided pairing source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 36 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build platform
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Reuse previously verified arm64 ADB binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-apk" app/src/main/jniLibs/arm64-v8a
          gh release download screensync-qr-20261115 \
            --pattern 'ScreenSync-QR-arm64.apk' \
            --dir "$RUNNER_TEMP/old-apk"
          unzip -p "$RUNNER_TEMP/old-apk/ScreenSync-QR-arm64.apk" \
            'lib/arm64-v8a/libadb.so' > app/src/main/jniLibs/arm64-v8a/libadb.so
          test "$(stat -c '%s' app/src/main/jniLibs/arm64-v8a/libadb.so)" -gt 3000000
          file app/src/main/jniLibs/arm64-v8a/libadb.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libadb.so

      - name: Compile guided QR application without native tool rebuild
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testScrcpyDebugUnitTest :app:assembleScrcpyDebug -PskipLibadb -PlibadbAbis=arm64-v8a --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/scrcpy/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          test "$(stat -c '%s' "$apk")" -gt 1000000
          unzip -t "$apk" | tail -2
          cp "$apk" ScreenSync-RemoteVPN-Beta2-arm64.apk
          zip -j ScreenSync-RemoteVPN-Beta2-arm64.zip ScreenSync-RemoteVPN-Beta2-arm64.apk
          sha256sum ScreenSync-RemoteVPN-Beta2-arm64.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-RemoteVPN-Beta2-debug
          path: |
            ScreenSync-RemoteVPN-Beta2-arm64.apk
            ScreenSync-RemoteVPN-Beta2-arm64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish easy browser download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create screensync-remote-vpn-beta2-20261116 \
            ScreenSync-RemoteVPN-Beta2-arm64.apk ScreenSync-RemoteVPN-Beta2-arm64.zip \
            --title 'ScreenSync 异地观看私有网络测试版' \
            --notes "源码：$GITHUB_SHA。在原有 ADB/scrcpy 上加入私有 VPN 异地传输实验支持：同一 Tailscale 私有网络、已批准的 ScreenSync 配对及 Android 无线调试授权、自动交换私有地址和连接端口，单一立即观看入口。无需额外 MediaProjection 录屏授权，但不保证所有小米/vivo机型或换网后的 ADB 始终在线。保留原有安全提示和停止观看按钮。"
