name: ScreenSync Beta4 NO-VPN scrcpy predeploy integration

on:
  workflow_dispatch:
  push:
    branches: [feature/screensync-beta4-novpn]
    paths:
      - 'remote/relay_v1/**'
      - 'app/**'
      - '.github/workflows/beta4-novpn.yml'
  pull_request:
    branches: [main]
    paths:
      - 'remote/relay_v1/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  signaling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard against abandoned VPN and WebRTC solutions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/org/client/scrcpy")
          for old in ("AutoRemoteProvisioner.java", "EmbeddedRemoteTunnel.java",
                      "RemoteOverlayNetwork.java", "NoVpnTransportPolicy.java"):
              assert not (base / old).exists(), f"retired class restored: {old}"
          assert "com.wireguard.android:tunnel" not in Path("app/build.gradle").read_text()
          assert not Path("remote/control").exists()
          assert not Path("remote/control_v2").exists()
          assert not Path("remote/setup_wg_vps_ubuntu.sh").exists()
          code = Path("remote/relay_v1/server.py").read_text()
          declared = code.split("ALLOWED_EVENTS = ", 1)[1].split("}",1)[0]
          for disallowed in ('"offer"', '"answer"', '"ice_candidate"'):
              assert disallowed not in declared, f"discarded signaling: {disallowed}"
          main = (base / "MainActivity.java").read_text()
          assert "VpnService.prepare(" not in main
          assert "EmbeddedRemoteTunnel" not in main
          layout = Path("app/src/main/res/layout/activity_main.xml").read_text()
          assert "remote_vpn_toggle_button" not in layout
          assert "remote_vpn_setup_button" not in layout
          print("Retired VPN and WebRTC routes absent from no-VPN branch")
          PY
      - name: Test HTTPS signaling and real localhost video relay
        run: |
          python3 -m venv "$RUNNER_TEMP/screensync-media-venv"
          . "$RUNNER_TEMP/screensync-media-venv/bin/activate"
          python3 -m pip install -r remote/relay_v1/requirements-media.txt
          python3 -m compileall -q remote/relay_v1
          python3 -m unittest discover -s remote/relay_v1 -p 'test_*.py' -v

  android-novpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore previously verified arm64 ADB binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-apk" app/src/main/jniLibs/arm64-v8a
          gh release download screensync-qr-20261115 \
            --pattern 'ScreenSync-QR-arm64.apk' \
            --dir "$RUNNER_TEMP/old-apk"
          unzip -p "$RUNNER_TEMP/old-apk/ScreenSync-QR-arm64.apk" \
            'lib/arm64-v8a/libadb.so' > app/src/main/jniLibs/arm64-v8a/libadb.so
          test "$(stat -c '%s' app/src/main/jniLibs/arm64-v8a/libadb.so)" -gt 3000000
      - name: Verify no foreground LAN receiver in no-VPN variant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          service = next((s for s in manifest.findall(".//service")
                          if s.attrib.get(android + "name") == ".WakeLanService"), None)
          assert service is not None, "Legacy LAN receiver must be explicitly disabled"
          assert service.attrib.get(android + "enabled") == "false", "No FGS receiver allowed"
          app = manifest.find("application")
          assert app is not None and app.attrib.get(android + "usesCleartextTraffic") == "false", \
              "HTTPS/WSS-only experimental APK must not permit cleartext HTTP"
          permissions = {p.attrib.get(android + "name") for p in manifest.findall("uses-permission")}
          assert "android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" not in permissions
          for name in ("NoVpnBackgroundSync.java", "NoVpnPresenceWorker.java"):
              source = Path("app/src/main/java/org/client/scrcpy") / name
              for line in source.read_text().splitlines():
                  t = line.strip()
                  if t.startswith("//") or t.startswith("*") or t.startswith("/*"):
                      continue
                  assert not t.startswith(("startForeground(", "setForeground(",
                                                  "setForegroundAsync(")), f"{name}: foreground worker forbidden"
          # All new media components are Activity-scoped, and the ADB
          # scrcpy socket is bound only to the source phone's loopback.
          for name in ("LocalScrcpyStreamer.java", "RelayVideoRenderer.java",
                       "NoVpnMediaSocket.java"):
              code = (Path("app/src/main/java/org/client/scrcpy") / name).read_text()
              assert "startForeground(" not in code
              assert "MediaProjectionManager" not in code
              assert "VpnService" not in code
          scrcpy_server = Path("server/src/main/java/org/server/scrcpy/Server.java").read_text()
          assert "startEventController(device, connection" not in scrcpy_server
          receiver = Path("server/src/main/java/org/server/scrcpy/DroidConnection.java").read_text()
          assert 'new java.net.InetSocketAddress("127.0.0.1", 7007)' in receiver
          print("Activity-scoped, local-ADB, read-only scrcpy constraints verified")
          print("No-VPN background sync has no app-initiated foreground receiver")
          PY
      - name: Verify no Android VPN component then unit tests and APK
        env:
          SCREENSYNC_NOVPN_URL: ${{ vars.SCREENSYNC_NOVPN_URL }}
          SCREENSYNC_MEDIA_URL: ${{ vars.SCREENSYNC_MEDIA_URL }}
        run: |
          set -euo pipefail
          if grep -E 'android.net.VpnService|BIND_VPN_SERVICE' app/src/main/AndroidManifest.xml; then
            echo 'No-VPN build must not declare Android VpnService' >&2
            exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:testScrcpyDebugUnitTest :app:assembleScrcpyDebug \
            -PskipLibadb -PlibadbAbis=arm64-v8a --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/scrcpy/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -t "$apk" | tail -2
          echo "Verify merged APK declares no Android VPN service:"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml \
              | grep -E 'android.net.VpnService|BIND_VPN_SERVICE|GoBackend\\$VpnService'; then
            echo "VPN service unexpectedly present in final APK" >&2
            exit 1
          fi
          cp "$apk" ScreenSync-Beta4-NoVPN-PreServer-Experimental-arm64.apk
          sha256sum ScreenSync-Beta4-NoVPN-PreServer-Experimental-arm64.apk \
            > ScreenSync-Beta4-NoVPN-PreServer-Experimental-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Beta4-NoVPN-PreServer-Experimental
          path: |
            ScreenSync-Beta4-NoVPN-PreServer-Experimental-arm64.apk
            ScreenSync-Beta4-NoVPN-PreServer-Experimental-arm64.sha256
          retention-days: 14
          if-no-files-found: error
