name: ScreenSync Beta4 auto-provision (experimental)

on:
  workflow_dispatch:
  push:
    branches: [feature/screensync-beta4-auto-remote]
    paths:
      - 'remote/control/**'
      - 'remote/control_v2/**'
      - 'app/**'
      - '.github/workflows/beta4-auto-provision.yml'
  pull_request:
    branches: [main]
    paths:
      - 'remote/control/**'
      - 'remote/control_v2/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and protocol authorization tests
        run: |
          python3 -m compileall -q remote/control
          python3 -m unittest discover -s remote/control -p 'test_*.py' -v
          python3 -m compileall -q remote/control_v2
          python3 -m unittest discover -s remote/control_v2 -p 'test_*.py' -v
          bash -n remote/control/install_ubuntu.sh
          bash -n remote/control_v2/install_ubuntu.sh
          bash -n remote/control_v2/ensure_deny.sh
          bash -n remote/control_v2/issue_owner_qr.sh

  kernel-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install real WireGuard and nft test tools in disposable VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wireguard-tools nftables iproute2 iputils-ping
      - name: Test real WireGuard handshakes, tenant isolation and nft revocation
        run: sudo bash remote/control_v2/test_kernel_network.sh

  build-beta4:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore previously verified arm64 ADB binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-apk" app/src/main/jniLibs/arm64-v8a
          gh release download screensync-qr-20261115 \
            --pattern 'ScreenSync-QR-arm64.apk' \
            --dir "$RUNNER_TEMP/old-apk"
          unzip -p "$RUNNER_TEMP/old-apk/ScreenSync-QR-arm64.apk" \
            'lib/arm64-v8a/libadb.so' > app/src/main/jniLibs/arm64-v8a/libadb.so
          test "$(stat -c '%s' app/src/main/jniLibs/arm64-v8a/libadb.so)" -gt 3000000
      - name: Unit tests and APK
        env:
          SCREENSYNC_API_URL: ${{ vars.SCREENSYNC_API_URL }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testScrcpyDebugUnitTest :app:assembleScrcpyDebug \
            -PskipLibadb -PlibadbAbis=arm64-v8a --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/scrcpy/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -t "$apk" | tail -2
          cp "$apk" ScreenSync-Beta4-experimental-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Beta4-experimental-arm64-debug
          path: ScreenSync-Beta4-experimental-arm64.apk
          retention-days: 14
          if-no-files-found: error
