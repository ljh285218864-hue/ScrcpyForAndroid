name: ScreenSync Notification Respect APK

on:
  workflow_dispatch:
  push:
    branches: [fix/screensync-lifecycle-keep-socket, feature/screensync-dismissible-start-alert]
    paths:
      - 'remote/relay_v1/**'
      - 'app/**'
      - '.github/workflows/background-continuity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'remote/relay_v1/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  signaling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check non-mutating VPS preflight and 8443 diagnostics
        run: |
          bash -n remote/relay_v1/deploy/read-only-preflight.sh
          bash -n remote/relay_v1/deploy/diagnose-8443.sh
          bash -n remote/relay_v1/deploy/deploy-accessibility-jpeg.sh
          bash -n remote/relay_v1/deploy/deploy-self-service-signaling.sh
          bash -n remote/relay_v1/deploy/deploy-rolling-jpeg-session-ttl.sh
      - name: Guard against abandoned VPN and WebRTC solutions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/org/client/scrcpy")
          for old in ("AutoRemoteProvisioner.java", "EmbeddedRemoteTunnel.java",
                      "RemoteOverlayNetwork.java", "NoVpnTransportPolicy.java"):
              assert not (base / old).exists(), f"retired class restored: {old}"
          assert "com.wireguard.android:tunnel" not in Path("app/build.gradle").read_text()
          assert not Path("remote/control").exists()
          assert not Path("remote/control_v2").exists()
          assert not Path("remote/setup_wg_vps_ubuntu.sh").exists()
          code = Path("remote/relay_v1/server.py").read_text()
          declared = code.split("ALLOWED_EVENTS = ", 1)[1].split("}",1)[0]
          for disallowed in ('"offer"', '"answer"', '"ice_candidate"'):
              assert disallowed not in declared, f"discarded signaling: {disallowed}"
          main = (base / "MainActivity.java").read_text()
          assert "VpnService.prepare(" not in main
          assert "EmbeddedRemoteTunnel" not in main
          layout = Path("app/src/main/res/layout/activity_main.xml").read_text()
          assert "remote_vpn_toggle_button" not in layout
          assert "remote_vpn_setup_button" not in layout
          print("Retired VPN and WebRTC routes absent from no-VPN branch")
          PY
      - name: Test HTTPS signaling and real localhost video relay
        run: |
          python3 -m venv "$RUNNER_TEMP/screensync-media-venv"
          . "$RUNNER_TEMP/screensync-media-venv/bin/activate"
          python3 -m pip install -r remote/relay_v1/requirements-media.txt
          python3 -m compileall -q remote/relay_v1
          python3 -m unittest discover -s remote/relay_v1 -p 'test_*.py' -v

  android-novpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore previously verified arm64 ADB binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-apk" app/src/main/jniLibs/arm64-v8a
          gh release download screensync-qr-20261115 \
            --pattern 'ScreenSync-QR-arm64.apk' \
            --dir "$RUNNER_TEMP/old-apk"
          unzip -p "$RUNNER_TEMP/old-apk/ScreenSync-QR-arm64.apk" \
            'lib/arm64-v8a/libadb.so' > app/src/main/jniLibs/arm64-v8a/libadb.so
          test "$(stat -c '%s' app/src/main/jniLibs/arm64-v8a/libadb.so)" -gt 3000000
      - name: Verify no foreground LAN receiver in no-VPN variant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          service = next((s for s in manifest.findall(".//service")
                          if s.attrib.get(android + "name") == ".WakeLanService"), None)
          assert service is not None, "Legacy LAN receiver must be explicitly disabled"
          assert service.attrib.get(android + "enabled") == "false", "No FGS receiver allowed"
          app = manifest.find("application")
          assert app is not None and app.attrib.get(android + "usesCleartextTraffic") == "false", \
              "HTTPS/WSS-only experimental APK must not permit cleartext HTTP"
          permissions = {p.attrib.get(android + "name") for p in manifest.findall("uses-permission")}
          assert "android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" not in permissions
          for name in ("NoVpnBackgroundSync.java", "NoVpnPresenceWorker.java"):
              source = Path("app/src/main/java/org/client/scrcpy") / name
              for line in source.read_text().splitlines():
                  t = line.strip()
                  if t.startswith("//") or t.startswith("*") or t.startswith("/*"):
                      continue
                  assert not t.startswith(("startForeground(", "setForeground(",
                                                  "setForegroundAsync(")), f"{name}: foreground worker forbidden"
          # Original scrcpy media components remain Activity-scoped; JPEG session has an explicit stop indication.
          # All new media components are Activity-scoped, and the ADB
          # scrcpy socket is bound only to the source phone's loopback.
          for name in ("LocalScrcpyStreamer.java", "RelayVideoRenderer.java",
                       "NoVpnMediaSocket.java"):
              code = (Path("app/src/main/java/org/client/scrcpy") / name).read_text()
              assert "startForeground(" not in code
              assert "MediaProjectionManager" not in code
              assert "VpnService" not in code
          # Regression guards for actual Android video connection path:
          # never drop decoder setup while discarding stale P-frames.
          renderer = (Path("app/src/main/java/org/client/scrcpy")
                      / "RelayVideoRenderer.java").read_text()
          assert "decoderThread.getQueue().clear()" not in renderer
          assert "task instanceof FrameTask" in renderer
          assert "sourceSession.equals(session)" in renderer
          media = (Path("app/src/main/java/org/client/scrcpy")
                   / "NoVpnMediaSocket.java").read_text()
          assert "locallyApprovedRequest" in media
          assert "socket != ws" in media
          source = (Path("app/src/main/java/org/client/scrcpy")
                    / "LocalScrcpyStreamer.java").read_text()
          assert "private static final int FORWARD_PORT = 7018" in source
          assert "RelayVideoFormat.forRotation" in source
          scrcpy_server = Path("server/src/main/java/org/server/scrcpy/Server.java").read_text()
          assert "startEventController(device, connection" not in scrcpy_server
          receiver = Path("server/src/main/java/org/server/scrcpy/DroidConnection.java").read_text()
          assert 'new java.net.InetSocketAddress("127.0.0.1", 7007)' in receiver
          flavor_manifest = Path("app/src/scrcpy/AndroidManifest.xml").read_text()
          assert 'android:name=".RemoteSetupActivity"' in flavor_manifest
          assert 'android:name=".MainActivity"' not in flavor_manifest
          base = Path("app/src/main/java/org/client/scrcpy")
          app_start = (base / "App.java").read_text()
          assert "AdbHelper.startAdbServer()" not in app_start
          ui = (base / "RemoteSetupActivity.java").read_text()
          assert "观看对方屏幕" in ui and "扫描另一台手机二维码" in ui
          assert 'action(content, "连接 WSS' not in ui
          assert 'action(content, "本机 ADB' not in ui
          print("Minimal app launcher and no developer-facing controls verified")
          print("Activity-scoped, local-ADB, read-only scrcpy constraints verified")
          print("No-VPN background sync has no app-initiated foreground receiver")
          base = Path("app/src/main/java/org/client/scrcpy")
          screenshot = (base / "AccessibilityShotService.java").read_text()
          assert "takeScreenshot(" in screenshot
          assert "MediaProjection" not in screenshot
          protocol = (base / "ScrcpyRelayWire.java").read_text()
          assert "encodeJpeg" in protocol
          client = (base / "NoVpnMediaSocket.java").read_text()
          assert 'MediaCodecPolicy.isAllowed(codec)' in client, "JPEG setup must be accepted"
          assert 'ScreenSyncDiagnostics.record' in client
          source = (base / "AccessibilityJpegStreamer.java").read_text()
          assert 'JPEG_SEND' in source and 'CAPTURE_FAIL' in source
          viewer = (base / "JpegFrameRenderer.java").read_text()
          assert 'JPEG_DISPLAY' in viewer
          full = (base / "FullscreenViewer.java").read_text()
          assert "closePicture()" in full
          assert "setVisibility(GONE)" in full
          assert "CENTER_CROP" in full and "FIT_CENTER" in full
          assert "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" in full
          activity = (base / "RemoteSetupActivity.java").read_text()
          assert 'new FullscreenViewer(this)' in activity
          assert 'viewerLayer.openPicture(' in activity
          assert 'previewPanel = panel(content)' not in activity
          assert 'viewerLayer.closePicture()' in activity
          assert 'showLocalAdbPairDialog()' not in activity
          transport = (base / "NoVpnMediaSocket.java").read_text()
          assert "hasActiveViewerSession()" in transport
          assert "hasViewerRequestOutstanding()" in transport
          assert "watchRequestInFlight" in transport
          server = Path("remote/relay_v1/server.py").read_text()
          assert '"/v1/self-register"' in server
          assert 'SELF_SERVICE_ENABLED' in server
          assert 'MAX_SELF_REGISTER_HOUR' in server
          api = (base / "NoVpnApi.java").read_text()
          assert '"/v1/self-register"' in api
          activity = (base / "RemoteSetupActivity.java").read_text()
          assert '"生成配对二维码"' in activity
          assert '"扫描另一台手机二维码"' in activity
          assert 'NoVpnApi.registerOwner(this)' in activity
          nginx = Path("remote/relay_v1/deploy/nginx-osaka-8443.conf").read_text()
          assert 'self-register|activate|join' in nginx
          assert "proxy_pass http://127.0.0.1:8766;" in nginx
          deploy = Path("remote/relay_v1/deploy/deploy-self-service-signaling.sh").read_text()
          assert "NGINX_TARGET_PATTERN" in deploy
          assert "nginx -t" in deploy and "systemctl reload nginx" in deploy
          assert "POST self-register" in deploy
          http = (base / "NoVpnApi.java").read_text()
          assert 'ApiResponsePolicy.isJsonResponse(responseType)' in http
          assert "API_ROUTE" in http
          assert 'new JSONObject(new String(result.toByteArray()' in http
          print("Self-register nginx route and actionable JSON-only API error handling checked")

          print("Self-service QR registration and explicit pair approval wiring verified")
          streamer = (base / "AccessibilityJpegStreamer.java").read_text()
          assert "public static String readinessIssue(Context context)" in streamer
          assert "sharing_channel_blocked" in streamer
          assert "notification_permission_missing" in streamer
          assert streamer.index("showNotice();") < streamer.index("socket.sendVideoSetup("), "Visible notice must precede media setup"
          activity = (base / "RemoteSetupActivity.java").read_text()
          assert "showSourcePrerequisiteDialog(issue)" in activity
          assert "mediaSocket.declineRequest(sid)" in activity
          assert "notificationAllowed(this)" in activity
          assert "source_permissions_missing" in activity
          socket = (base / "NoVpnMediaSocket.java").read_text()
          assert "WATCH_END_REMOTE" in socket
          assert 'endSourceSession(String reason)' in socket
          print("Share prerequisites, explicit consent, zero-frame diagnostics and visible notification guard verified")
          assert "NOTIFICATION_CHECK_INTERVAL_MS = 5000L" in streamer
          assert "stopDueToNotificationSettings();" in streamer
          assert "showDismissibleStartAlert" not in streamer
          assert 'NotificationManager.IMPORTANCE_LOW' in streamer
          assert 'setShowBadge(false)' in streamer
          assert '"sharing_channel_blocked"' in streamer
          print("Single low-importance notification respects Android notification opt-out")

          tuning = (base / "JpegStreamTuning.java").read_text()
          assert "MAX_LONG_EDGE = 1440" in tuning
          assert "JPEG_QUALITY = 74" in tuning
          assert "CAPTURE_GAP_MS = 265L" in tuning
          assert "MAX_PENDING_BYTES_BEFORE_CAPTURE" in tuning
          source = (base / "AccessibilityJpegStreamer.java").read_text()
          assert "socket.isSourceBackpressured()" in source
          assert "JpegStreamTuning.targetSize(" in source
          assert "compressionQuality" in source
          transport = (base / "NoVpnMediaSocket.java").read_text()
          assert ".pingInterval(0, TimeUnit.SECONDS)" in transport
          assert "isSourceBackpressured()" in transport
          relay = Path("remote/relay_v1/media_relay.py").read_text()
          assert "ping_interval=20, ping_timeout=20" in relay
          assert "session.frames_in_window > 4" in relay
          print("Sharpness, transport backpressure, server keepalive and <=4-fps JPEG cap verified")
          activity = (base / "RemoteSetupActivity.java").read_text()
          assert 'ScreenSyncMediaKeeper.retain(socket)' in activity
          assert 'ScreenSyncMediaKeeper.current()' in activity
          assert 'mediaSocket.clearListenerIf(mediaListener)' in activity
          pause = activity.split("@Override protected void onPause()", 1)[1].split(
              "@Override protected void onDestroy()", 1)[0]
          assert 'mediaSocket.close()' not in pause
          assert 'jpegRenderer.stopSession()' not in pause
          assert 'stopLocalStream()' not in pause
          assert 'startLocalStream();' in activity
          assert 'ScreenSyncWatchNotice.show(RemoteSetupActivity.this)' in activity
          transport = (base / "NoVpnMediaSocket.java").read_text()
          assert 'redispatchIncomingRequest()' in transport
          assert 'ScreenSyncWatchNotice.show(context)' in transport
          assert 'clearListenerIf(Listener previous)' in transport
          notice = (base / "ScreenSyncWatchNotice.java").read_text()
          assert 'setAutoCancel(true)' in notice
          assert 'ScreenSync 观看申请' in notice
          assert '确认是否允许本次屏幕共享' in notice
          assert 'startForeground' not in notice
          assert 'BOOT_COMPLETED' not in notice
          print("Process-lifetime WSS retention, no background auto-capture and user approval guard verified")
          relay = Path("remote/relay_v1/media_relay.py").read_text()
          assert 'session.expires = time.monotonic() + SESSION_TTL_SECONDS' in relay
          assert 'await self.discard(session_id, "stopped_by_device")' in relay
          print("Rolling expiry applies only to live, approved media delivery; stop and revoke still work")





          capture = (base / "AccessibilityJpegStreamer.java").read_text()
          assert "CAPTURE_TIMEOUT" in capture
          print("Fullscreen-only rendering, close-preserves-session and screenshot watchdog verified")

          ui = (base / "RemoteSetupActivity.java").read_text()
          assert "诊断日志 · 排查黑屏" in ui

          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          assert "android.permission.BIND_ACCESSIBILITY_SERVICE" in manifest
          assert "AccessibilityShareStopReceiver" in manifest
          assert "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" not in manifest
          PY
      - name: Verify no Android VPN component then unit tests and APK
        env:
          # Dedicated Osaka Beta4 test server. Do not use old/unset repo variables.
          # Gradle's fail-closed invalid defaults remain unchanged for other builds.
          SCREENSYNC_NOVPN_URL: https://relay.privyluxe.com:8443
          SCREENSYNC_MEDIA_URL: wss://relay.privyluxe.com:8443/media
        run: |
          set -euo pipefail
          if grep -E 'android.net.VpnService|BIND_VPN_SERVICE' app/src/main/AndroidManifest.xml; then
            echo 'No-VPN build must not declare Android VpnService' >&2
            exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:testScrcpyDebugUnitTest :app:assembleScrcpyDebug \
            -PskipLibadb -PlibadbAbis=arm64-v8a --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/scrcpy/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -t "$apk" | tail -2
          echo "Verify merged APK declares no Android VPN service:"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml \
              | grep -E 'android.net.VpnService|BIND_VPN_SERVICE|GoBackend\\$VpnService'; then
            echo "VPN service unexpectedly present in final APK" >&2
            exit 1
          fi
          echo "Verify the assembled APK DEX includes the Osaka HTTPS/WSS endpoints:"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as zf:
              dex_files = [n for n in zf.namelist() if n.startswith("classes") and n.endswith(".dex")]
              assert dex_files, "APK does not contain classes DEX"
              payload = b"".join(zf.read(n) for n in dex_files)
          required = [
              b"https://relay.privyluxe.com:8443",
              b"wss://relay.privyluxe.com:8443/media",
          ]
          for endpoint in required:
              assert endpoint in payload, "Missing compiled BuildConfig endpoint: " + endpoint.decode()
              print("PASS embedded:", endpoint.decode())
          for forbidden in (b"https://relay.invalid", b"wss://relay.invalid/media"):
              assert forbidden not in payload, "Invalid placeholder endpoint found inside compiled DEX"
          print("PASS: invalid placeholder URLs absent from compiled DEX")
          PY
          cp "$apk" ScreenSync-Notification-Respect-Osaka8443-arm64.apk
          sha256sum ScreenSync-Notification-Respect-Osaka8443-arm64.apk \
            > ScreenSync-Notification-Respect-Osaka8443-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Notification-Respect-Osaka8443
          path: |
            ScreenSync-Notification-Respect-Osaka8443-arm64.apk
            ScreenSync-Notification-Respect-Osaka8443-arm64.sha256
          retention-days: 14
          if-no-files-found: error
