name: Android Debug APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:=${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          test -f "$ANDROID_SDK_ROOT/ndk/26.3.11579264/build/cmake/android.toolchain.cmake"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake patch bison flex

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleScrcpyDebug -PlibadbAbis=arm64-v8a

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyForAndroid-arm64-debug
          path: app/build/outputs/apk/scrcpy/debug/*.apk
          if-no-files-found: error
          retention-days: 14
