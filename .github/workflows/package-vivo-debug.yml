name: Package vivo and iQOO debug APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-vivo-debug.yml
      - 'app/**'
      - 'gradle/**'
      - gradlew
      - build.gradle
      - settings.gradle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-debug:
    name: Build installable Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate and configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT=""
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              SDK_ROOT="$candidate"
              break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory missing on runner"
            ls -la /usr/local/lib/android /opt || true
            exit 1
          fi
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build patch bison flex
          cmake --version
          ninja --version

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -f "$SDK_ROOT/ndk/26.3.11579264/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Compile read-only screen mirror debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleScrcpyDebug -PlibadbAbis=arm64-v8a --no-daemon --stacktrace
          find app/build/outputs/apk/scrcpy/debug -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/scrcpy/debug -type f -name '*.apk' -print -quit)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vivo-iqoo-debug-apk
          path: app/build/outputs/apk/scrcpy/debug/*.apk
          retention-days: 14
          if-no-files-found: error
