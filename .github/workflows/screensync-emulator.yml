name: ScreenSync Android 15 virtual-device lifecycle test

on:
  push:
    branches:
      - feature/screensync-persistent-watch-consent-20261122
    paths:
      - '.github/workflows/screensync-emulator.yml'
      - '.github/scripts/screensync-emulator-lifecycle.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android15-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCREENSYNC_MEDIA_URL: wss://relay.privyluxe.com:8443/media
      SCREENSYNC_NOVPN_URL: https://relay.privyluxe.com:8443
    steps:
      - uses: actions/checkout@v4
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the actual ScreenSync APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleScrcpyDebug --no-daemon
      - name: Boot Android 15 virtual device and perform real lifecycle actions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/screensync-emulator-lifecycle.sh
      - name: Upload emulator screenshots, accessibility dumps and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Android15-emulator-evidence
          path: emulator-test-results/**
          if-no-files-found: warn
          retention-days: 14
