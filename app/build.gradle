apply plugin: 'com.android.application'

android {
    namespace = 'org.client.scrcpy'
    compileSdk = 36
    flavorDimensions = ['default']

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdk = 24
        targetSdk = 36
        versionCode = 39
        versionName = '1.8.1-jpeg-only'
        buildConfigField 'String', 'SCREENSYNC_MEDIA_URL', '"' +
            (System.getenv('SCREENSYNC_MEDIA_URL') ?: 'wss://relay.invalid/media') + '"'
        buildConfigField 'String', 'SCREENSYNC_NOVPN_URL', '"' +
            (System.getenv('SCREENSYNC_NOVPN_URL') ?: 'https://relay.invalid') + '"'
        // Optional Firebase client identifiers. No service-account credentials
        // belong in Android builds. Leaving these empty preserves legacy mode.
        buildConfigField 'String', 'FCM_APP_ID',
            groovy.json.JsonOutput.toJson(System.getenv('SCREENSYNC_FCM_APP_ID') ?: '')
        buildConfigField 'String', 'FCM_PROJECT_ID',
            groovy.json.JsonOutput.toJson(System.getenv('SCREENSYNC_FCM_PROJECT_ID') ?: '')
        buildConfigField 'String', 'FCM_SENDER_ID',
            groovy.json.JsonOutput.toJson(System.getenv('SCREENSYNC_FCM_SENDER_ID') ?: '')
        buildConfigField 'String', 'FCM_API_KEY',
            groovy.json.JsonOutput.toJson(System.getenv('SCREENSYNC_FCM_API_KEY') ?: '')
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    productFlavors {
        scrcpy {
            // Preserve installed package id and saved, approved pair identity.
            applicationId = 'org.client.scrcpy'
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def versionName = output.versionName.get()
            def versionCode = output.versionCode.get()
            output.outputFileName.set(
                "ScreenSync-${versionName}-r${versionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
