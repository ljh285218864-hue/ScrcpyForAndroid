apply plugin: 'com.android.application'

android {
    namespace = 'org.client.scrcpy'
    compileSdk = 36
    flavorDimensions = ['default']

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdk = 24
        targetSdk = 36
        versionCode = 40
        versionName = '1.8.2-vivo-recovery-diag'
        buildConfigField 'String', 'SCREENSYNC_MEDIA_URL', '"' +
            (System.getenv('SCREENSYNC_MEDIA_URL') ?: 'wss://relay.invalid/media') + '"'
        buildConfigField 'String', 'SCREENSYNC_NOVPN_URL', '"' +
            (System.getenv('SCREENSYNC_NOVPN_URL') ?: 'https://relay.invalid') + '"'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    productFlavors {
        scrcpy {
            // Preserve installed package id and saved, approved pair identity.
            applicationId = 'org.client.scrcpy'
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def versionName = output.versionName.get()
            def versionCode = output.versionCode.get()
            output.outputFileName.set(
                "ScreenSync-${versionName}-r${versionCode}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
